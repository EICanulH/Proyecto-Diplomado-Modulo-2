project:
  type: book
  output-dir: docs

book:
  title: "Proyecto Módulo 2"
  author: 
  - "Brenda Poulette Torres Vargas"
  - "Diego Betancourt Peralta"
  - "Erick Iván Canul Hernández"
  - "José Omar Gutiérrez Gutiérrez"
  - "Maximiliano Hernández Pérez"
  date: today
  chapters:
    - index.qmd
    - 01-vuelos-ny\parte1-vuelos-ny.qmd
    - 02-api-nasa\parte2-api-nasa.qmd
    - 03-coffee-ratings\parte3-coffee-ratings.qmd

format:
  html:
    theme: 
      dark: [darkly, darkly-fix.scss]
      light: [flatly, flatly-fix.scss]
    highlight-style:
      dark: nord
      light: atom-one
    respect-user-color-scheme: true
    df-print: paged
    toc: true
    toc-depth: 5
    number-sections: false
    toc-expand: true
    grid:
      sidebar-width: 300px
      body-width: 1100px
      margin-width: 300px
      gutter-width: 1.1rem
    
execute:
  cache: true
  freeze: auto
  echo: true
  output: true
  warning: false
  message: false